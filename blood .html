<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Reserves</title>
</head>

<body>

    <h1>Blood Reserves</h1>

    <label for="blood-group-abo">ABO Blood Group</label>
    <select id="blood-group-abo">
        <option value="A">A</option>
        <option value="AB">AB</option>
        <option value="B">B</option>
        <option value="O">O</option>
    </select>

    <br>

    <label for="blood-group-rh">Rh Factor</label>
    <select id="blood-group-rh">
        <option value="positive">Positive</option>
        <option value="negative">Negative</option>
    </select>

    <br>

    <button id="get-blood-units-button">Get blood units</button>

    <div id="display-blood-units">
        <p>Blood group: <span id="blood-group-display"></span></p>
        <p>Units available: <span id="units-available"></span></p>
    </div>

    <script>
        // Find the inputs and display elements
        let bloodGroupAboInput = document.querySelector('#blood-group-abo')
        let bloodGroupRhInput = document.querySelector('#blood-group-rh')
        let getBloodUnitsButton = document.querySelector('#get-blood-units-button')
        let bloodGroupDisplay = document.querySelector('#blood-group-display')
        let unitsAvailableDisplay = document.querySelector('#units-available')

        // Run this code when the button is clicked
        getBloodUnitsButton.addEventListener('click', function () {

            // Get the selected blood group and Rh factor
            let aboGroupValue = bloodGroupAboInput.value
            let rhFactorValue = bloodGroupRhInput.value

            // Combine the two values for the API request
            let bloodType = aboGroupValue + rhFactorValue

            // Create the API request URL
            let apiRequestUrl = 'https://blood-group-api.wl.r.appspot.com/api/blood_units_by_group?group=' + bloodType

            // Request the available blood units
            fetch(apiRequestUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Could not get blood availability')
                    }
                    return response.json()
                })
                .then(jsonData => {
                    // Get the blood availability from the response
                    let results = jsonData.results
                    let availability = results.blood_availability
                    console.log(availability)
                    console.log(results)

                    // Display the blood group and available units
                    bloodGroupDisplay.innerHTML = aboGroupValue + (rhFactorValue === 'positive' ? '+' : '-')
                    unitsAvailableDisplay.innerHTML = availability.units_available
                })
                .catch(error => {
                    // Show the error in the console
                    console.log(error)

                    // Display a friendly error message on the page
                    bloodGroupDisplay.innerHTML = ''
                    unitsAvailableDisplay.innerHTML = 'Sorry, could not get blood availability. Please try again.'
                })
        })
    </script>

</body>

</html>
